# Alembic — migrations de schema da Nuvem IA (Lote R0).
# A URL do banco NAO fica aqui: alembic/env.py le DATABASE_URL do ambiente
# (mesma variavel que o app usa). Rodar na mao (dentro do container ou do venv):
#   alembic upgrade head
#   alembic current
#   alembic stamp 0001_baseline   (so o caminho de contingencia — ver docs/DEPLOY.md)

[alembic]
script_location = alembic
prepend_sys_path = .
