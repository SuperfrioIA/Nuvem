# as tabelas da V1/V2 seguem la.
#
# O que saiu do ar junto: /admin, /nuvem, /cockpit, /laboratorio, /linhagem e a
# ingestao do DataHub (o "Sincronizar agora" daquela tela). O backup diario NAO
