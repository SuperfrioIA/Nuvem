  # A V3 -- volumetria de catering, app propria (`catering/app.py`), MESMA
  # imagem. Porta 8003 no host: 80 e o Conciliador, 8001 o Hub, 8002 era a V2.
  # 8003 e a mesma porta do caminho C local, de proposito -- porta diferente
  # entre ambientes e um mal-entendido esperando a hora.
  nuvem-cat:
    build: .
    # `--no-access-log` aqui por motivo DIFERENTE da V2. A V2 tem middleware
    # proprio que loga metodo+path sem query string; a V3 nao tem nenhum, e o
    # access log do uvicorn loga a URL inteira -- o recorte da tela viaja em
    # query string (`clientes=`, `unidades=`), entao seria cliente e filial em
    # claro no log: exatamente o defeito que o Bloco G corrigiu na V2.
    #
    # O que fica no lugar e MELHOR que access log: a V3 audita em banco
    # (`cat_auditoria`, V3.3/V3.4) usuario, evento, recorte, formato, linhas e
    # IP. Log de requisicao morre com o container; auditoria em banco entra no
    # backup.
    command: ["uvicorn", "catering.app:app", "--host", "0.0.0.0",
              "--port", "8000", "--workers", "1", "--no-access-log"]
    ports:
      - "8003:8000"
    environment:
      # Mesmo banco da V2, de proposito (V3.0): a cadeia de migrations e uma so.
      DATABASE_URL: postgresql://nuvem:${POSTGRES_PASSWORD}@nuvem-db:5432/nuvem
      # Chave de sessao PROPRIA da V3 -- nao e a SECRET_KEY da V2 (V3.4).
      CAT_SECRET_KEY: ${CAT_SECRET_KEY}
      # Fuso em que data e hora APARECEM na tela (V3.5.1). Nao confundir com o
      # fuso do crontab, que e UTC de proposito (docs/DEPLOY.md).
      CAT_FUSO_EXIBICAO: ${CAT_FUSO_EXIBICAO:-America/Sao_Paulo}
      # Primeiro dia do recorte com que a TELA abre. `ano-corrente` = 1o de
      # janeiro do ano de hoje. Nao e o piso da carga (DW_ANO_MINIMO).
      CAT_ABERTURA_DE: ${CAT_ABERTURA_DE:-ano-corrente}
      # Credencial do DW, por VARIAVEL e nunca por argumento de linha de
      # comando -- argumento aparece em `ps` e no historico do shell.
      DW_USER: ${DW_USER}
      DW_SENHA: ${DW_SENHA}
      # Primeiro ano que a CARGA le, por nk_calendario. 2023 = o historico
      # inteiro que o DW publica (V3.8). Nao confundir com CAT_ABERTURA_DE,
      # que e onde a tela abre.
      DW_ANO_MINIMO: ${DW_ANO_MINIMO:-2023}
    depends_on:
      nuvem-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nuvem-db:
    image: postgres:16
    environment:
      POSTGRES_DB: nuvem
      POSTGRES_USER: nuvem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nuvem_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvem -d nuvem"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  nuvem_db_data:
