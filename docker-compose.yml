#
# As migrations da V3 (0019-0023) NAO entraram pelo startup deste servico, que e
# como teriam entrado se ele subisse: foram aplicadas explicitamente, com
# `docker compose run --rm nuvem-cat alembic upgrade head` (ver docs/DEPLOY.md).
