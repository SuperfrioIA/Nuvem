services:
  nuvem-app:
    build: .
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://nuvem:${POSTGRES_PASSWORD}@nuvem-db:5432/nuvem
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      UPLOADS_DIR: /app/data/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SITE_PATH: ${GRAPH_SITE_PATH:-}
      GRAPH_PASTA: ${GRAPH_PASTA:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      IA_MODELO: ${IA_MODELO:-claude-sonnet-5}
      IA_EFFORT: ${IA_EFFORT:-medium}
    volumes:
      - ${UPLOADS_HOST_PATH:-./data/uploads}:/app/data/uploads
    depends_on:
      nuvem-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  nuvem-db:
    image: postgres:16
    environment:
      POSTGRES_DB: nuvem
      POSTGRES_USER: nuvem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nuvem_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvem -d nuvem"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  nuvem_db_data:
