services:
  nuvem-app:
    build: .
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql://nuvem:${POSTGRES_PASSWORD}@nuvem-db:5432/nuvem
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      UPLOADS_DIR: /app/data/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-50}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SITE_PATH: ${GRAPH_SITE_PATH:-}
      GRAPH_PASTA: ${GRAPH_PASTA:-}
    volumes:
      - ${UPLOADS_HOST_PATH:-./data/uploads}:/app/data/uploads
    depends_on:
      nuvem-db:
        condition: service_healthy
    restart: unless-stopped

  nuvem-db:
    image: postgres:16
    environment:
      POSTGRES_DB: nuvem
      POSTGRES_USER: nuvem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - nuvem_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuvem -d nuvem"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  nuvem_db_data:
